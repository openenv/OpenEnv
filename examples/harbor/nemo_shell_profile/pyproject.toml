[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-nat-shell-profile"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["nvidia-nat[langchain]==1.9.0"]

[project.entry-points."nat.components"]
openenv_nat_shell = "openenv_nat_shell.register"

[tool.setuptools.packages.find]
where = ["src"]
