name: Discovery catalog

on:
  pull_request:
    paths:
      - src/openenv/discovery/**
      - src/openenv/cli/commands/catalog.py
      - tests/discovery/**
      - envs/**
      - pyproject.toml
      - scripts/generate_discovery_schemas.py
      - .github/workflows/discovery-catalog.yml
  push:
    branches: [main]
    paths:
      - src/openenv/discovery/**
      - envs/**
      - pyproject.toml
      - .github/workflows/discovery-catalog.yml
  workflow_dispatch:


permissions: {}

jobs:
  snapshot:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --group dev
      - name: Check the profile and producer
        run: |
          uv run python scripts/generate_discovery_schemas.py --check
          uv run pytest tests/discovery -q
        env:
          PYTHONPATH: src:envs
      - name: Generate committed repository metadata
        run: |
          uv run openenv catalog build \
            --repository . \
            --repository-uri "https://github.com/$SOURCE_REPOSITORY.git" \
            --publisher github.com \
            --namespace "$SOURCE_OWNER" \
            --revision "$SOURCE_REVISION" \
            --output openenv-catalog.json
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_OWNER: ${{ github.repository_owner }}
          SOURCE_REVISION: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openenv-catalog-${{ github.sha }}
          path: openenv-catalog.json
          if-no-files-found: error
