name: Docs PR preview

# Publishes the docs built by docs.yml for a pull request to
# <site>/pr-preview/pr-N/ and removes them when the pull request closes.
#
# docs.yml builds pull requests without write access (forks included). This
# workflow runs from main with write access and never runs pull request code: it
# only copies the static files the build uploaded. Previews are served from the
# docs domain, so pull requests from outside contributors are published only
# after a maintainer adds the docs-preview label and re-runs their Docs check.

on:
  workflow_run:
    workflows: [Docs]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ROOT_URL: ${{ vars.DOCS_SITE_URL || 'https://openenv.github.io/OpenEnv' }}
    steps:
      - name: Find the pull request
        id: pr
        env:
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            | jq --arg sha "$HEAD_SHA" 'map(select(.head.sha == $sha)) | first // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request at $HEAD_SHA (closed or pushed again)."
            exit 0
          fi
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          jq -r --arg repo "$REPO" '"trusted=" + (
            .head.repo.full_name == $repo
            or (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))
            or any(.labels[]; .name == "docs-preview")
          | tostring)' <<<"$pr" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.trusted == 'true'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.pr.outputs.trusted == 'true'
        with:
          name: docs-site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish the preview
        if: steps.pr.outputs.trusted == 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: docs/pages/publish.sh "pr-preview/pr-$NUMBER" site

      - name: Comment on the pull request
        if: steps.pr.outputs.number != ''
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          TRUSTED: ${{ steps.pr.outputs.trusted }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          marker="<!-- docs-preview -->"
          if [ "$TRUSTED" = true ]; then
            body="$marker
          The docs for this pull request are available at $ROOT_URL/pr-preview/pr-$NUMBER/ (commit ${HEAD_SHA:0:7}). The preview may take a minute to update and is removed when the pull request closes."
          else
            body="$marker
          The docs for this pull request built successfully. A maintainer can publish a preview by adding the \`docs-preview\` label and re-running the Docs check."
          fi
          id=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$NUMBER/comments" -f body="$body" >/dev/null
          fi

  remove:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checks out main, not the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove the preview
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: docs/pages/publish.sh "pr-preview/pr-$NUMBER"
