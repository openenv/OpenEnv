name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@1d2fd4ce6230951d654b5ec9b5cdb2b8175dbe8c  # main
    with:
      commit_sha: ${{ github.sha }}
      package: openenv
      repo_owner: openenv
      version_tag_suffix: ""
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
