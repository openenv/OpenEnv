name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@9b0e5b334b65d006b59e0b1a022a33122f7e12aa  # main
    with:
      commit_sha: ${{ github.sha }}
      package: openenv
      repo_owner: openenv
      version_tag_suffix: ""
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
