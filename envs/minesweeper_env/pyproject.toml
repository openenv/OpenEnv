[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-minesweeper-env"
version = "0.1.0"
description = "Minesweeper Environment for OpenEnv - grid-based puzzle game"
requires-python = ">=3.10"
dependencies = [
    "openenv>=0.3.1",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "minesweeper_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["minesweeper_env", "minesweeper_env.server"]
package-dir = { "minesweeper_env" = ".", "minesweeper_env.server" = "server" }
