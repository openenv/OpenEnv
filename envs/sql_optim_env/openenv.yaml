spec_version: 1
name: sql_optim_env
version: 0.1.0
type: space
runtime: fastapi
app: server.app:app
port: 8000
validation:
  reward:
    range: [0.0, 1.0]
    oracle_tolerance: 0.0
    floor_margin: 0.5
  resources:
    cpu: 2.0
    # docker-local uses MiB; /tmp database and spill files also consume memory.
    # DuckDB caps: 256 MiB buffer memory + 128 MiB spill; see README.
    memory_mb: 1024
    disk_mb: 1024
    episode_timeout_s: 120.0
  capabilities:
    verifier:
      kind: reward_channel
  types:
    tags: [sql, code, optimization]
