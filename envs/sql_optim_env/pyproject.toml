[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-sql-optim-env"
version = "0.1.0"
description = "SQL Query Optimization Environment for OpenEnv - execution-grounded RL with real DuckDB timing"
requires-python = ">=3.11"
dependencies = [
    "openenv>=0.4.1",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "duckdb>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "sql_optim_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["sql_optim_env", "sql_optim_env.server"]
package-dir = { "sql_optim_env" = ".", "sql_optim_env.server" = "server" }
