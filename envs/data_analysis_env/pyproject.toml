[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-data-analysis-env"
version = "0.1.0"
description = "Data-analysis environment for OpenEnv: answer questions about real data files from a sandboxed Python session"
requires-python = ">=3.10"
# Ranges, not exact pins: the package is installed next to training stacks (vLLM, TRL) that
# bring their own numpy and openenv versions. uv.lock pins what the Docker image runs.
dependencies = [
    "openenv>=0.13.0",
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    # Available to the agent's code in the sandbox.
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    # Server side only: reads the task split (parquet). Kept out of the sandbox workers.
    "pyarrow>=15",
    # The dataset's grader (last tier).
    "math-verify[antlr4_13_2]>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
server = "data_analysis_env.server.app:main"

[tool.setuptools]
packages = ["data_analysis_env", "data_analysis_env.server"]
package-dir = { "data_analysis_env" = ".", "data_analysis_env.server" = "server" }

[tool.setuptools.package-data]
data_analysis_env = ["**/*.yaml", "**/*.yml"]
