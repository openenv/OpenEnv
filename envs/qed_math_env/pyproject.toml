[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-qed_math_env"
version = "0.1.0"
description = "Qed Math Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    "openenv>=0.2.2",
    # Environment-specific dependencies
    "datasets>=4.7.0",
    "math-verify[antlr4_13_2]>=0.9.0",
    "trackio>=0.19.0"
    # Add all dependencies needed for your environment here
    # Examples:
    # "numpy>=1.19.0",
    # "torch>=2.0.0",
    # "gymnasium>=0.29.0",
    # "openspiel>=1.0.0",
    # "smolagents>=1.22.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m qed_math_env.server.app
server = "qed_math_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["qed_math_env", "qed_math_env.server"]
package-dir = { "qed_math_env" = ".", "qed_math_env.server" = "server" }
