spec_version: 1
name: posttrain_env
runtime: fastapi
app: server.app:app
port: 8000

description: >
  The agent post-trains a model by submitting scripts to HF Jobs through a
  broker that holds the credentials and enforces a per-rollout budget. A
  grader-only evaluation of the submitted checkpoint, on a hidden split, is the
  reward. Prototype for RFC 014 (Environment Services).
version: "0.1.0"

# Run this server where its HF token is not shared with the agent: a container
# or host you control. Do not deploy it as a public Space; a Space gives no
# isolation guarantee for the credential it holds (RFC 014, decision 2).
#
# Server configuration, never stored in this file:
#   HF_TOKEN                     broker token: "Start and manage Jobs" plus
#                                write access to <namespace>/jobs-artifacts
#   POSTTRAIN_NAMESPACE          namespace jobs run in (default: token owner)
#   POSTTRAIN_RESOURCE_GROUP_ID  optional Resource Group with a Jobs spend limit
#   POSTTRAIN_TEST_SEED          hidden test split seed (default: random per process)

validation:
  reward:
    range: [0.0, 1.0]
    oracle_tolerance: 0.0
    floor_margin: 0.5
  # The server only brokers; training and evaluation run on HF Jobs.
  resources:
    cpu: 1.0
    memory_mb: 1024
    disk_mb: 512
    episode_timeout_s: 3600.0  # the policy maximum; t0_artifact fits, longer tasks set their own limit
  capabilities:
    verifier:
      kind: reward_channel
    declared_tools:
      [budget, jobs_submit, jobs_status, jobs_wait, jobs_logs, jobs_cancel, dev_evaluate, submit]
  types:
    tags: [post-training, hf-jobs, environment-services]
