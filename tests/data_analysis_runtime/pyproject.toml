[project]
name = "openenv-data-analysis-runtime-tests"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "openenv",
    "openenv-data-analysis-env[dev]",
]

[tool.uv]
package = false

# Resolve against the same core that the tests import, not a published release.
[tool.uv.sources]
openenv = { path = "../..", editable = false }
openenv-data-analysis-env = { path = "../../envs/data_analysis_env", editable = false }
