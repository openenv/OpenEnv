<div class="tb">
  <div class="tb-head">
    <div><h1>Tasks</h1><p>Every task this server serves. Open one to read exactly what the agent gets, then run an agent on it.</p></div>
    <div class="tb-stats"></div>
  </div>
  <div class="tb-toolbar">
    <div class="tb-search"><span class="tb-search-ic"></span>
      <input class="hb-input tb-q" type="search" placeholder="Search titles, briefs, tags…" autocomplete="off" aria-label="Search tasks"></div>
    <button class="hb-btn tb-random" type="button" title="Open a random task from the current results">Random</button>
  </div>
  <div class="tb-layout">
    <aside class="tb-filters" aria-label="Filters"></aside>
    <section>
      <div class="tb-addwrap"></div>
      <div class="tb-results-h"><span class="count" aria-live="polite"></span><div class="tb-active"></div></div>
      <ul class="tb-list" aria-label="Tasks"></ul>
      <div class="tb-more" hidden></div>
    </section>
  </div>
</div>
